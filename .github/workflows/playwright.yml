name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  typecheck:
    name: Typecheck (TypeScript gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript typecheck
        run: npm run typecheck

  assert-quality-audit:
    name: Assert Quality Audit (static gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Audit test quality (detect tautological/empty assertions)
        run: npm run audit:test-quality

  e2e:
    # Best-effort: roda contra o site demo publico do nopCommerce (terceiro,
    # fora do nosso controle), que fica atras de protecao anti-bot da
    # Cloudflare e bloqueia automacao de forma intermitente (confirmado em
    # 08/10/2026: headless, headed, stealth plugin, user-agent real e espera
    # de 30s - todos bloqueados). Isso nao e falha do codigo nem dos testes.
    # Os gates reais e obrigatorios deste pipeline sao o Typecheck e o
    # Assert Quality Audit. Ver README para detalhes.
    name: E2E Tests (best-effort, nao bloqueante)
    needs: typecheck
    continue-on-error: true
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
